name: Ops Map Sync

# Pulls Headquarters + open GitHub Issues + optional live Engine into synced_meta.json
on:
  schedule:
    - cron: "15 9 * * *"   # daily 09:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run Ops Map sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_HQ_PAGE_ID: ${{ secrets.NOTION_HQ_PAGE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: godkinghades123/houseofhades
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
          TASTYTRADE_CLIENT_ID: ${{ secrets.TASTYTRADE_CLIENT_ID }}
          TASTYTRADE_ACCOUNT_NUMBER: ${{ secrets.TASTYTRADE_ACCOUNT_NUMBER }}
          TASTYTRADE_ENV: ${{ secrets.TASTYTRADE_ENV }}
        run: python scripts/sync_ops_map.py

      - name: Commit synced_meta.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/src/data/synced_meta.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(ops-map): sync Headquarters + Issues + Engine into synced_meta.json"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
